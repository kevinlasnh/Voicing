name: Build And Release

# 触发方式（2026-11-22 第二次改造）：
# 1) 推送 v* tag：完整发布流程，构建 Android / Windows / Linux 并创建 GitHub Release。
# 2) workflow_dispatch 手动触发：同样自动创建/更新 GitHub Release（tag 由 workflow
#    自动创建为 v<仓库版本号>），资产包含 Android APK + Linux DEB/standalone；
#    手动发布不构建 Windows。任何一次「完成全部任务」后的发版都走这条路径。
# 3) 两条路径都会上传 workflow artifact，便于核对/下载；tag 推送保留 Windows 资产。
# macOS 构建已按用户要求彻底移除（不再编译 macOS Action），禁止再加回 build-macos。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare-release:
    name: Prepare Release Metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      version_number: ${{ steps.version.outputs.version_number }}
      release_tag: ${{ steps.version.outputs.release_tag }}
      is_release: ${{ steps.version.outputs.is_release }}

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve build version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          # push tag = 完整发布（含 Windows）；workflow_dispatch 手动构建也会
          # 自动发布 Release（无 Windows），因此 release_tag 两条路径都要给出。
          if [ "$EVENT_NAME" = "push" ] && [ "$REF_TYPE" = "tag" ]; then
            VERSION="$REF_NAME"
            VERSION_NUMBER="${REF_NAME#v}"
            IS_RELEASE=true
          else
            # 优先级：android/voice_coding/pubspec.yaml 的 version 前缀 -> pc/voice_coding.py 的 APP_VERSION。
            # 两个来源互不影响：某个文件缺失时继续尝试另一个来源（|| true 防止 set -e 提前退出）。
            PUBSPEC_VERSION="$(sed -nE 's/^version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+)(\+[0-9A-Za-z.-]+)?[[:space:]]*$/\1/p' android/voice_coding/pubspec.yaml 2>/dev/null | head -n 1 || true)"
            APP_VERSION="$(sed -nE 's/^APP_VERSION[[:space:]]*=[[:space:]]*"([^"]+)"[[:space:]]*$/\1/p' pc/voice_coding.py 2>/dev/null | head -n 1 || true)"
            if [ -n "$PUBSPEC_VERSION" ]; then
              VERSION_NUMBER="$PUBSPEC_VERSION"
            elif [ -n "$APP_VERSION" ]; then
              VERSION_NUMBER="$APP_VERSION"
            else
              echo "::error::无法从 pubspec.yaml 或 pc/voice_coding.py 推导版本号，手动构建中止"
              exit 1
            fi
            if [ -n "$PUBSPEC_VERSION" ] && [ -n "$APP_VERSION" ] && [ "$PUBSPEC_VERSION" != "$APP_VERSION" ]; then
              echo "::warning::pubspec 版本 $PUBSPEC_VERSION 与 APP_VERSION $APP_VERSION 不一致，本轮采用 pubspec 版本"
            fi
            if [ "$VERSION_NUMBER" = "$REF_NAME" ]; then
              echo "::error::推导出的版本 $VERSION_NUMBER 与分支名相同，拒绝用分支名作为版本号"
              exit 1
            fi
            VERSION="v$VERSION_NUMBER"
            IS_RELEASE=false
          fi

          if ! printf '%s' "$VERSION_NUMBER" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::非法版本号：$VERSION_NUMBER（要求 X.Y.Z 或 X.Y.Z-suffix）"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_number=$VERSION_NUMBER" >> "$GITHUB_OUTPUT"
          echo "release_tag=v$VERSION_NUMBER" >> "$GITHUB_OUTPUT"
          echo "is_release=$IS_RELEASE" >> "$GITHUB_OUTPUT"
          echo "::notice title=Build version::构建版本 $VERSION（version_number=$VERSION_NUMBER, release_tag=v$VERSION_NUMBER, full_release=$IS_RELEASE）"

      - name: Extract changelog for this release
        # 两条触发路径都必须有对应版本的 CHANGELOG：自动 Release 的正文只来自这里。
        env:
          VERSION: ${{ steps.version.outputs.version }}
          IS_RELEASE: ${{ steps.version.outputs.is_release }}
        run: |
          set -euo pipefail
          CHANGELOG_VERSION="${VERSION#v}"
          awk "/## \\[$CHANGELOG_VERSION\\]/{flag=1} flag{print} /^---$/{if(flag)exit}" CHANGELOG.md > release_notes.md

          if ! grep -q "^## \\[$CHANGELOG_VERSION\\]" release_notes.md; then
            echo "::error::CHANGELOG.md 中缺少版本 $CHANGELOG_VERSION 的条目，自动 Release 中止"
            exit 1
          fi

          {
            echo ""
            echo "### 下载说明"
            echo ""
            echo "| 文件 | 平台 | 说明 |"
            echo "|------|------|------|"
            echo "| \`voicing.apk\` | Android | 手机安装包 |"
            if [ "$IS_RELEASE" = "true" ]; then
              echo "| \`voicing-windows-x64.exe\` | Windows | Windows 10/11 (64-bit) |"
            fi
            echo "| \`voicing-linux-amd64.deb\` | Ubuntu | Ubuntu 22.04+ GNOME |"
            echo "| \`voicing-linux-x86_64\` | Ubuntu | Standalone Linux binary |"
            echo ""
            if [ "$IS_RELEASE" != "true" ]; then
              echo "> 本 Release 由 \`workflow_dispatch\` 自动化发布，包含 Android APK 与 Linux 资产（手动发布不含 Windows EXE）。"
              echo ""
            fi
            echo "### 系统要求"
            echo ""
            echo "- Windows 10/11 (64位)"
            echo "- Android 5.0+ (API 21+)"
            echo "- Ubuntu 22.04+ GNOME on X11, or GNOME Wayland with RemoteDesktop portal"
            echo ""
            echo "### 完整性校验"
            echo ""
            echo "- Release 同时提供 \`SHA256SUMS.txt\`"
            echo "- 下载后可先校验 SHA-256 摘要，再安装或运行产物"
            echo ""
          } >> release_notes.md

      - name: Upload release notes artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-notes
          path: release_notes.md

      - name: Write build summary
        env:
          IS_RELEASE: ${{ steps.version.outputs.is_release }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ "$IS_RELEASE" = "true" ]; then TRIGGER="tag 发布"; else TRIGGER="workflow_dispatch 手动构建"; fi
          {
            echo "### Voicing CI"
            echo ""
            echo "- 触发方式：$TRIGGER"
            echo "- 构建版本：$VERSION"
            echo "- 发布 GitHub Release：是（tag = v<version_number>）"
            echo "- 是否含 Windows 资产：$IS_RELEASE（仅 push tag 为 true）"
            echo "- 构建产物 artifact：\`android-apk\`、\`linux-bin\`、\`linux-deb\`"
          } >> "$GITHUB_STEP_SUMMARY"

  build-android:
    name: Build Android APK
    # tag 发布与手动构建都产出 APK（手动构建 APK 仅作为 run artifact 保留）。
    needs: prepare-release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: zulu
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version: 3.27.0
          cache: true

      - name: Get dependencies
        working-directory: android/voice_coding
        run: flutter pub get

      - name: Verify Android release signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for secret_name in \
            ANDROID_KEYSTORE_BASE64 \
            ANDROID_KEYSTORE_PASSWORD \
            ANDROID_KEY_ALIAS \
            ANDROID_KEY_PASSWORD
          do
            if [ -z "${!secret_name}" ]; then
              echo "Missing required Android release signing secret: $secret_name"
              exit 1
            fi
          done

      - name: Prepare Android release signing
        working-directory: android/voice_coding/android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > app/release-keystore.jks
          cat > key.properties <<EOF
          storeFile=release-keystore.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: Run Flutter analyze
        working-directory: android/voice_coding
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run Flutter tests
        working-directory: android/voice_coding
        run: flutter test

      - name: Build APK
        working-directory: android/voice_coding
        run: flutter build apk --release

      - name: Rename APK
        run: mv android/voice_coding/build/app/outputs/flutter-apk/app-release.apk android/voice_coding/build/app/outputs/flutter-apk/voicing.apk

      - name: Upload workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-apk
          path: android/voice_coding/build/app/outputs/flutter-apk/voicing.apk
          if-no-files-found: error

  build-windows:
    name: Build Windows EXE
    # Windows 只在 push tag 的正式发布构建；workflow_dispatch（即使 ref 是 tag）
    # 也按手动构建处理，不产出 Windows EXE。
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: prepare-release
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: pc
        run: pip install -r requirements.txt

      - name: Run desktop validation
        working-directory: pc
        run: |
          python -m py_compile voice_coding.py platform_utils.py platform_keyboard.py platform_autostart.py platform_instance.py network_recovery.py voicing_protocol.py device_identity.py
          python -m unittest discover -s tests
          python -c "from voice_coding import calculate_broadcast_addresses, get_all_local_interfaces; interfaces = get_all_local_interfaces(); print('interfaces=', interfaces); print('broadcasts=', calculate_broadcast_addresses(interfaces))"

      - name: Build EXE with PyInstaller
        working-directory: pc
        run: pyinstaller --noconfirm --clean --onefile --windowed --name=Voicing --icon=assets/icon.ico --add-data "assets;assets" voice_coding.py

      - name: Rename EXE
        shell: powershell
        run: Copy-Item "pc\dist\Voicing.exe" -Destination "pc\dist\voicing-windows-x64.exe"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-exe
          path: pc/dist/voicing-windows-x64.exe
          if-no-files-found: error

  build-linux:
    name: Build Linux Desktop Binary
    needs: prepare-release
    runs-on: ubuntu-22.04
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libdbus-1-3 libxkbcommon-x11-0 libxcb-cursor0

      - name: Install dependencies
        working-directory: pc
        run: pip install -r requirements.txt

      - name: Run desktop validation
        working-directory: pc
        run: |
          python -m py_compile voice_coding.py platform_utils.py platform_keyboard.py platform_autostart.py platform_instance.py network_recovery.py voicing_protocol.py device_identity.py
          python -m unittest discover -s tests
          python -c "from voice_coding import calculate_broadcast_addresses, get_all_local_interfaces; interfaces = get_all_local_interfaces(); print('interfaces=', interfaces); print('broadcasts=', calculate_broadcast_addresses(interfaces))"

      - name: Build Linux executable
        working-directory: pc
        run: pyinstaller --noconfirm --clean --onefile --windowed --name=Voicing --add-data "assets:assets" voice_coding.py

      - name: Rename artifact
        run: cp pc/dist/Voicing pc/dist/voicing-linux-x86_64

      - name: Build DEB package
        env:
          VERSION_NUMBER: ${{ needs.prepare-release.outputs.version_number }}
        run: |
          # DEB Version 只能来自 prepare-release 推导的仓库版本，禁止使用分支名。
          VERSION="$VERSION_NUMBER"
          if [ -z "$VERSION" ]; then
            echo "缺少 DEB Version（prepare-release 未输出 version_number）" >&2
            exit 1
          fi
          if [ "$VERSION" = "main" ] || [ "$VERSION" = "master" ]; then
            echo "DEB Version 不能是分支名：$VERSION" >&2
            exit 1
          fi

          PKG_ROOT="pc/dist/deb-root"
          mkdir -p \
            "$PKG_ROOT/DEBIAN" \
            "$PKG_ROOT/opt/voicing" \
            "$PKG_ROOT/usr/bin" \
            "$PKG_ROOT/usr/share/applications" \
            "$PKG_ROOT/usr/share/icons/hicolor/1024x1024/apps"

          install -m 0755 pc/dist/Voicing "$PKG_ROOT/opt/voicing/voicing"
          install -m 0644 pc/assets/icon_1024.png "$PKG_ROOT/usr/share/icons/hicolor/1024x1024/apps/voicing.png"
          ln -s /opt/voicing/voicing "$PKG_ROOT/usr/bin/voicing"

          cat > "$PKG_ROOT/usr/share/applications/voicing.desktop" <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=Voicing
          Comment=Phone to desktop voice input bridge
          Exec=/opt/voicing/voicing
          Icon=voicing
          Terminal=false
          Categories=Utility;
          EOF

          cat > "$PKG_ROOT/DEBIAN/control" <<EOF
          Package: voicing
          Version: $VERSION
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: Kevin <kevinlasnh@users.noreply.github.com>
          Depends: libegl1, libdbus-1-3, libxkbcommon-x11-0, libxcb-cursor0
          Description: Phone to desktop voice input bridge
           Voicing receives text from an Android phone and injects it at the
           current desktop cursor position.
          EOF

          chmod 0644 \
            "$PKG_ROOT/DEBIAN/control" \
            "$PKG_ROOT/usr/share/applications/voicing.desktop"
          find "$PKG_ROOT" -type d -exec chmod 0755 {} +
          dpkg-deb --root-owner-group --build "$PKG_ROOT" "pc/dist/voicing-linux-amd64.deb"

      - name: Verify DEB package version
        env:
          VERSION_NUMBER: ${{ needs.prepare-release.outputs.version_number }}
        run: |
          DEB_VERSION="$(dpkg-deb -f pc/dist/voicing-linux-amd64.deb Version)"
          echo "DEB Version = $DEB_VERSION（期望 $VERSION_NUMBER）"
          test "$DEB_VERSION" = "$VERSION_NUMBER"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: linux-bin
          path: pc/dist/voicing-linux-x86_64
          if-no-files-found: error

      - name: Upload DEB workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: linux-deb
          path: pc/dist/voicing-linux-amd64.deb
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    # 2026-11-22 起两条触发路径都发布 Release：
    # - push tag：完整发布，额外上传 Windows EXE；
    # - workflow_dispatch：自动创建/更新 tag v<version_number> 的 Release，
    #   资产为 APK + Linux DEB/standalone（无 Windows）。
    # 用 always() 是为了在 Windows job 被手动构建跳过时仍能发布；
    # 显式 result 检查保证 Android/Linux 构建失败时绝不发半成品 Release。
    if: >-
      always() &&
      needs.prepare-release.result == 'success' &&
      needs.build-android.result == 'success' &&
      needs.build-linux.result == 'success' &&
      (needs.build-windows.result == 'success' || needs.build-windows.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs:
      - prepare-release
      - build-android
      - build-windows
      - build-linux

    steps:
      - name: Download release notes artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-notes
          path: release-assets/release-notes

      - name: Download Android artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: android-apk
          path: release-assets/android

      - name: Download Windows artifact (tag releases only)
        if: needs.prepare-release.outputs.is_release == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: windows-exe
          path: release-assets/windows

      - name: Download Linux artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: linux-bin
          path: release-assets/linux

      - name: Download Linux DEB artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: linux-deb
          path: release-assets/linux

      - name: Generate release checksums
        run: |
          set -euo pipefail
          cd release-assets
          FILES=(
            android/voicing.apk
            linux/voicing-linux-amd64.deb
            linux/voicing-linux-x86_64
          )
          EXPECTED=3
          if [ -f windows/voicing-windows-x64.exe ]; then
            FILES+=(windows/voicing-windows-x64.exe)
            EXPECTED=4
          fi
          sha256sum "${FILES[@]}" \
            | sed -E 's#  (android|windows|linux)/#  #' \
            > SHA256SUMS.txt
          test "$(wc -l < SHA256SUMS.txt)" -eq "$EXPECTED"
          if awk '{print $2}' SHA256SUMS.txt | grep -q '/'; then
            echo "SHA256SUMS.txt must use flat GitHub Release asset names" >&2
            exit 1
          fi
          echo "SHA256SUMS.txt ($EXPECTED assets):"
          cat SHA256SUMS.txt

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          # 手动构建时 tag 不存在，由 GitHub API 在 target_commitish 上自动创建，
          # 从而做到「推一次手动 Action = 发一次新 Release」。
          tag_name: ${{ needs.prepare-release.outputs.release_tag }}
          target_commitish: ${{ github.sha }}
          name: Voicing ${{ needs.prepare-release.outputs.version }}
          body_path: release-assets/release-notes/release_notes.md
          files: |
            release-assets/android/voicing.apk
            release-assets/linux/voicing-linux-amd64.deb
            release-assets/linux/voicing-linux-x86_64
            release-assets/SHA256SUMS.txt
          fail_on_unmatched_files: true
          overwrite_files: true
          make_latest: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows asset to tag release
        if: needs.prepare-release.outputs.is_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.release_tag }}
        run: |
          set -euo pipefail
          # tag 发布才包含 Windows 资产；单独上传避免影响手动发布的文件列表。
          gh release upload "$RELEASE_TAG" \
            release-assets/windows/voicing-windows-x64.exe \
            --clobber \
            --repo "$GITHUB_REPOSITORY"
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json url,assets \
            --jq '{url, assets: [.assets[].name]}'
